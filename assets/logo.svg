<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title>Lucky Spa &amp; Massage</title>
  <desc>Guld logotyp med lotusblomma och text.</desc>
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#f8e8ab"/>
      <stop offset="48%" stop-color="#d9b04a"/>
      <stop offset="100%" stop-color="#9a6d17"/>
    </radialGradient>
    <linearGradient id="petal" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#f5f0e6"/>
      <stop offset="100%" stop-color="#d9d1c3"/>
    </linearGradient>
    <linearGradient id="textGold" x1="0%" x2="100%">
      <stop offset="0%" stop-color="#fff3c4"/>
      <stop offset="45%" stop-color="#f6d771"/>
      <stop offset="100%" stop-color="#9a6d17"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#5d420f" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="#efe0ba"/>
  <circle cx="512" cy="420" r="286" fill="url(#bgGlow)" filter="url(#shadow)"/>

  <g transform="translate(512 340)" opacity="0.9">
    <g fill="none" stroke="#f8e7a8" stroke-linecap="round">
      <path d="M0 -182 V-52" stroke-width="3"/>
      <path d="M-30 -178 V-62" stroke-width="2"/>
      <path d="M30 -178 V-62" stroke-width="2"/>
      <path d="M-64 -170 V-74" stroke-width="2"/>
      <path d="M64 -170 V-74" stroke-width="2"/>
      <path d="M-102 -155 V-84" stroke-width="2"/>
      <path d="M102 -155 V-84" stroke-width="2"/>
      <path d="M-136 -132 V-92" stroke-width="2"/>
      <path d="M136 -132 V-92" stroke-width="2"/>
      <path d="M-158 -96 V-92" stroke-width="2"/>
      <path d="M158 -96 V-92" stroke-width="2"/>
      <path d="M-176 -58 V-92" stroke-width="2"/>
      <path d="M176 -58 V-92" stroke-width="2"/>
    </g>

    <g transform="translate(0 20)">
      <ellipse cx="0" cy="0" rx="56" ry="126" fill="url(#petal)"/>
      <ellipse cx="-80" cy="16" rx="50" ry="108" fill="url(#petal)" transform="rotate(-26 -80 16)"/>
      <ellipse cx="80" cy="16" rx="50" ry="108" fill="url(#petal)" transform="rotate(26 80 16)"/>
      <ellipse cx="-142" cy="60" rx="42" ry="88" fill="url(#petal)" transform="rotate(-50 -142 60)"/>
      <ellipse cx="142" cy="60" rx="42" ry="88" fill="url(#petal)" transform="rotate(50 142 60)"/>
      <ellipse cx="-48" cy="92" rx="40" ry="90" fill="url(#petal)" transform="rotate(62 -48 92)"/>
      <ellipse cx="48" cy="92" rx="40" ry="90" fill="url(#petal)" transform="rotate(-62 48 92)"/>
      <ellipse cx="0" cy="110" rx="58" ry="138" fill="url(#petal)" transform="rotate(90 0 110)"/>
      <circle cx="0" cy="8" r="42" fill="#f9e680"/>
      <circle cx="0" cy="8" r="22" fill="#fff8d7"/>
    </g>
  </g>

  <g fill="url(#textGold)" filter="url(#shadow)">
    <text x="512" y="700" text-anchor="middle" font-family="Cormorant Garamond, Georgia, serif" font-size="110" font-weight="700" letter-spacing="-1">Lucky Spa</text>
    <text x="512" y="804" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="62" font-weight="600" letter-spacing="-1">Massage</text>
  </g>

  <rect x="172" y="850" width="680" height="10" rx="5" fill="rgba(255,255,255,0.35)"/>
</svg>
